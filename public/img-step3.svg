  <path d="M8 70 C8 56 20 44 28 40 L36 38 L38 46 L32 48 C28 50 22 56 22 64Z" fill="#3d6b4a"/>
  <!-- Left fingers -->
  <rect x="30" y="26" width="10" height="24" rx="5" fill="#3d6b4a"/>
  <rect x="42" y="22" width="10" height="28" rx="5" fill="#3d6b4a"/>
  <rect x="54" y="24" width="10" height="26" rx="5" fill="#3d6b4a"/>
  <rect x="66" y="30" width="10" height="22" rx="5" fill="#3d6b4a"/>
  <!-- Left palm -->
  <rect x="28" y="44" width="50" height="22" rx="10" fill="#3d6b4a"/>

  <!-- Right hand (orange) -->
  <path d="M92 70 C92 56 80 44 72 40 L64 38 L62 46 L68 48 C72 50 78 56 78 64Z" fill="#f97316"/>
