  <rect x="60" y="26" width="10" height="24" rx="5" fill="#f97316"/>
  <rect x="48" y="22" width="10" height="28" rx="5" fill="#f97316"/>
  <rect x="36" y="24" width="10" height="26" rx="5" fill="#f97316"/>
