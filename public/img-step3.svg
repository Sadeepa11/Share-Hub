  <circle cx="18" cy="30" r="4" fill="#faf7f2" opacity="0.5"/>
  <circle cx="82" cy="30" r="4" fill="#faf7f2" opacity="0.5"/>
  <circle cx="50" cy="88" r="5" fill="#3d6b4a" opacity="0.35"/>
</svg>
