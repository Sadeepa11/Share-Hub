<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Envelope body -->
  <rect x="10" y="28" width="80" height="58" rx="10" fill="#3d6b4a"/>
  <!-- Envelope flap closed -->
  <path d="M10 38 L50 62 L90 38" fill="#2d4a35"/>
  <path d="M10 28 L50 52 L90 28" fill="#2d4a35"/>
  <!-- Envelope bottom crease lines -->
  <path d="M10 86 L34 64" stroke="#2d4a35" stroke-width="1.5" opacity="0.5"/>
  <path d="M90 86 L66 64" stroke="#2d4a35" stroke-width="1.5" opacity="0.5"/>
  <!-- Notification badge -->
  <circle cx="75" cy="22" r="18" fill="#f97316"/>
  <!-- Number 3 in badge -->
  <text x="75" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="white" font-family="sans-serif">3</text>
  <!-- Pulse ring -->
  <circle cx="75" cy="22" r="22" stroke="#f97316" stroke-width="2" opacity="0.35"/>
  <!-- Stars -->
  <path d="M20 22 L21 17 L22 22 L27 23 L22 24 L21 29 L20 24 L15 23Z" fill="#faf7f2" opacity="0.55"/>
  <circle cx="42" cy="18" r="3" fill="#faf7f2" opacity="0.4"/>
</svg>
