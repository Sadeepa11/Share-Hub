  <path d="M82 180 C60 195 48 215 44 232" stroke="#3d6b4a" stroke-width="20" stroke-linecap="round"/>
  <!-- Right arm (extended forward to box) -->
  <path d="M146 180 C165 192 178 210 186 230" stroke="#3d6b4a" stroke-width="20" stroke-linecap="round"/>
