    <rect x="17" y="16" width="30" height="3.5" rx="1.5" fill="#d1d5db"/>
    <rect x="17" y="24" width="22" height="3.5" rx="1.5" fill="#d1d5db"/>
    <rect x="17" y="32" width="28" height="3.5" rx="1.5" fill="#d1d5db"/>
    <rect x="17" y="40" width="18" height="3.5" rx="1.5" fill="#d1d5db"/>
    <rect x="17" y="48" width="26" height="3.5" rx="1.5" fill="#d1d5db"/>
    <rect x="17" y="56" width="20" height="3.5" rx="1.5" fill="#d1d5db"/>
  </g>

