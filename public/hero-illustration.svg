  <path d="M268 232 C252 210 226 212 232 228 C238 244 268 232 268 232Z" fill="#ea580c"/>
  <!-- Bow right loop -->
  <path d="M268 232 C284 210 310 212 304 228 C298 244 268 232 268 232Z" fill="#ea580c"/>
  <!-- Bow knot -->
  <circle cx="268" cy="232" r="8" fill="#c2410c"/>
  <!-- Heart on box -->
  <path d="M274 278 C274 268 260 265 260 274 C260 265 246 268 246 278 C246 288 260 298 260 298 C260 298 274 288 274 278Z" fill="white" opacity="0.92"/>

  <!-- ===== RIGHT PERSON (Receiver) ===== -->
  <!-- Shadow -->
  <ellipse cx="408" cy="368" rx="48" ry="12" fill="#0a1a10" opacity="0.18"/>
  <!-- Legs -->
  <rect x="386" y="268" width="22" height="88" rx="11" fill="#2d4a35"/>
  <rect x="412" y="268" width="22" height="88" rx="11" fill="#2d4a35"/>
