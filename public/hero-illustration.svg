  <circle cx="398" cy="113" r="4.5" fill="#1b3022"/>
  <circle cx="422" cy="113" r="4.5" fill="#1b3022"/>
  <circle cx="399.5" cy="111.5" r="1.5" fill="white"/>
  <circle cx="423.5" cy="111.5" r="1.5" fill="white"/>
  <!-- Eyebrows -->
  <path d="M392 104 Q398 100 404 104" stroke="#1b3022" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M416 104 Q422 100 428 104" stroke="#1b3022" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Big smile -->
  <path d="M396 130 Q410 144 424 130" stroke="#1b3022" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Cheeks -->
  <circle cx="392" cy="128" r="8" fill="#f97316" opacity="0.3"/>
  <circle cx="428" cy="128" r="8" fill="#f97316" opacity="0.3"/>

