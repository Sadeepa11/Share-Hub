  <!-- Stars -->
  <path d="M174 42 L176 34 L178 42 L186 44 L178 46 L176 54 L174 46 L166 44Z" fill="#f97316" opacity="0.8"/>
  <path d="M340 58 L342 50 L344 58 L352 60 L344 62 L342 70 L340 62 L332 60Z" fill="#faf7f2" opacity="0.65"/>
  <path d="M462 262 L463.5 256 L465 262 L471 263.5 L465 265 L463.5 271 L462 265 L456 263.5Z" fill="#f97316" opacity="0.6"/>
  <path d="M40 160 L41.5 154 L43 160 L49 161.5 L43 163 L41.5 169 L40 163 L34 161.5Z" fill="#faf7f2" opacity="0.55"/>
  <path d="M488 158 L489 153 L490 158 L495 159 L490 160 L489 165 L488 160 L483 159Z" fill="#faf7f2" opacity="0.4"/>
  <path d="M30 346 L31 341 L32 346 L37 347 L32 348 L31 353 L30 348 L25 347Z" fill="#f97316" opacity="0.4"/>

  <!-- Dots -->
  <circle cx="170" cy="368" r="9" fill="#f97316" opacity="0.22"/>
  <circle cx="350" cy="378" r="7" fill="#3d6b4a" opacity="0.3"/>
  <circle cx="478" cy="310" r="11" fill="#f97316" opacity="0.2"/>
  <circle cx="32" cy="308" r="8" fill="#faf7f2" opacity="0.18"/>
  <circle cx="476" cy="82" r="14" fill="#3d6b4a" opacity="0.22"/>
  <circle cx="18" cy="86" r="10" fill="#f97316" opacity="0.2"/>
  <circle cx="260" cy="418" r="6" fill="#f97316" opacity="0.25"/>

  <!-- Ground shadow -->
