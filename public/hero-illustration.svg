    <circle cx="28" cy="16" r="3" fill="#1b3022"/>
    <ellipse cx="22" cy="22" rx="5" ry="3.5" fill="#ea580c"/>
    <path d="M16 26 Q22 31 28 26" stroke="#1b3022" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Belly patch -->
