    <rect width="38" height="64" rx="8" fill="#faf7f2"/>
    <rect x="3" y="6" width="32" height="46" rx="5" fill="#3d6b4a"/>
    <circle cx="19" cy="57" r="3.5" fill="#d1d5db"/>
