<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <defs>
    <!-- Gradients matching app colors: #0D3B2E (deep green), #E86C38 (warm orange), #FAF6ED (cream) -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E86C38" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6B9B7E" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FAF6ED" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E86C38"/>
      <stop offset="100%" stop-color="#D05523"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D6A53"/>
      <stop offset="100%" stop-color="#0D3B2E"/>
    </linearGradient>
    
    <!-- Soft Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0D3B2E" flood-opacity="0.25"/>
    </filter>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#E86C38" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Decorative Circles & Connecting Arc -->
  <circle cx="300" cy="250" r="210" fill="url(#bgGlow)"/>
  <path d="M120 320 C 180 140, 420 140, 480 320" stroke="#FAF6ED" stroke-opacity="0.3" stroke-width="3" stroke-dasharray="8 8"/>
  <circle cx="300" cy="90" r="6" fill="#E86C38"/>
  <circle cx="150" cy="180" r="4" fill="#FAF6ED" fill-opacity="0.6"/>
  <circle cx="450" cy="180" r="4" fill="#FAF6ED" fill-opacity="0.6"/>

  <!-- Left Floating Card: Donating / Giving -->
  <g transform="translate(70, 160)" filter="url(#shadow)">
    <rect width="180" height="210" rx="20" fill="url(#cardGrad1)"/>
    
    <!-- Gift Box Illustration -->
    <rect x="55" y="65" width="70" height="55" rx="10" fill="url(#orangeGrad)"/>
    <path d="M50 50 C50 40 70 40 70 50 C70 40 90 40 90 50 Z" fill="#E86C38" opacity="0.8"/>
    <rect x="85" y="65" width="10" height="55" fill="#FAF6ED" opacity="0.9"/>
    <rect x="55" y="85" width="70" height="10" fill="#FAF6ED" opacity="0.9"/>

    <!-- User Avatar & Badge -->
    <circle cx="90" cy="145" r="16" fill="#0D3B2E"/>
    <!-- Person Icon -->
    <circle cx="90" cy="141" r="5" fill="#FAF6ED"/>
    <path d="M81 154 C81 148 85 147 90 147 C95 147 99 148 99 154" stroke="#FAF6ED" stroke-width="2"/>
    
    <rect x="40" y="172" width="100" height="18" rx="9" fill="#0D3B2E" fill-opacity="0.08"/>
    <text x="90" y="184" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#0D3B2E">Donor (Share)</text>
  </g>

  <!-- Right Floating Card: Requesting / Receiving -->
  <g transform="translate(350, 160)" filter="url(#shadow)">
    <rect width="180" height="210" rx="20" fill="url(#cardGrad1)"/>
    
    <!-- Book / Educational Supplies Illustration -->
    <rect x="55" y="60" width="70" height="60" rx="6" fill="url(#greenGrad)"/>
    <path d="M65 60 V120 M75 75 H115 M75 90 H105 M75 105 H110" stroke="#FAF6ED" stroke-width="3" stroke-linecap="round"/>
    
    <!-- User Avatar & Badge -->
    <circle cx="90" cy="145" r="16" fill="#E86C38"/>
    <!-- Person Icon -->
    <circle cx="90" cy="141" r="5" fill="#FAF6ED"/>
    <path d="M81 154 C81 148 85 147 90 147 C95 147 99 148 99 154" stroke="#FAF6ED" stroke-width="2"/>

    <rect x="40" y="172" width="100" height="18" rx="9" fill="#E86C38" fill-opacity="0.1"/>
    <text x="90" y="184" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#E86C38">Recipient (Receive)</text>
  </g>

  <!-- Center Connecting Heart Badge (Community Connection) -->
  <g transform="translate(250, 200)" filter="url(#glowOrange)">
    <circle cx="50" cy="50" r="42" fill="url(#orangeGrad)"/>
    <circle cx="50" cy="50" r="36" fill="none" stroke="#FAF6ED" stroke-width="2" stroke-dasharray="4 4"/>
    
    <!-- Heart & Hands Combined Icon -->
    <path d="M50 63 C40 53 32 45 32 37 C32 31 36 27 42 27 C46 27 49 29 50 32 C51 29 54 27 58 27 C64 27 68 31 68 37 C68 45 60 53 50 63 Z" fill="#FAF6ED"/>
  </g>

  <!-- Floating Decorative Floating Pill Badges -->
  <!-- Eco / Green Tag -->
  <g transform="translate(190, 80)" filter="url(#shadow)">
    <rect width="110" height="34" rx="17" fill="#FAF6ED"/>
    <circle cx="107" cy="17" r="10" fill="#6B9B7E" opacity="0.2"/>
    <path d="M18 17 C18 12 23 11 26 14 C27 18 22 22 18 17 Z" fill="#2D6A53"/>
    <text x="34" y="21" font-family="sans-serif" font-size="11" font-weight="700" fill="#0D3B2E">Zero Waste</text>
  </g>

  <!-- Impact Tag -->
  <g transform="translate(315, 380)" filter="url(#shadow)">
    <rect width="125" height="34" rx="17" fill="#0D3B2E"/>
    <text x="20" y="21" font-family="sans-serif" font-size="11" font-weight="700" fill="#FAF6ED">100% Free Share</text>
  </g>
</svg>
