    <rect x="10" y="18" width="40" height="3" rx="1.5" fill="#faf7f2" opacity="0.35"/>
    <rect x="10" y="24" width="32" height="3" rx="1.5" fill="#faf7f2" opacity="0.35"/>
    <rect x="10" y="30" width="36" height="3" rx="1.5" fill="#faf7f2" opacity="0.35"/>
  </g>

