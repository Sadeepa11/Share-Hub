  <circle cx="476" cy="238" r="13" fill="#f4c49e"/>
  <!-- Neck -->
  <rect x="399" y="144" width="22" height="22" rx="8" fill="#f4c49e"/>
  <!-- Head -->
  <circle cx="410" cy="118" r="40" fill="#f4c49e"/>
  <!-- Hair (wavy/curly) -->
  <path d="M370 104 Q374 66 410 68 Q446 66 450 104 Q448 82 410 80 Q372 82 370 104Z" fill="#c2410c"/>
  <path d="M370 104 Q368 95 372 90 Q376 82 382 84 Q374 90 374 100Z" fill="#c2410c"/>
  <path d="M450 104 Q452 95 448 90 Q444 82 438 84 Q446 90 446 100Z" fill="#c2410c"/>
