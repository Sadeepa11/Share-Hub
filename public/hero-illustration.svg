  <circle cx="44" cy="238" r="13" fill="#f4c49e"/>
  <circle cx="188" cy="236" r="13" fill="#f4c49e"/>
  <!-- Neck -->
  <rect x="103" y="144" width="22" height="22" rx="8" fill="#f4c49e"/>
  <!-- Head -->
  <circle cx="114" cy="118" r="40" fill="#f4c49e"/>
