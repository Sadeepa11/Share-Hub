  <circle cx="126" cy="113" r="4.5" fill="#1b3022"/>
  <circle cx="103.5" cy="111.5" r="1.5" fill="white"/>
  <circle cx="127.5" cy="111.5" r="1.5" fill="white"/>
  <!-- Eyebrows -->
  <path d="M96 104 Q102 100 108 104" stroke="#1b3022" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M120 104 Q126 100 132 104" stroke="#1b3022" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Smile -->
  <path d="M102 130 Q114 142 126 130" stroke="#1b3022" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Cheeks -->
  <circle cx="96" cy="128" r="8" fill="#f97316" opacity="0.25"/>
  <circle cx="132" cy="128" r="8" fill="#f97316" opacity="0.25"/>

  <!-- ===== DONATION BOX (center) ===== -->
  <!-- Box shadow -->
  <ellipse cx="260" cy="332" rx="68" ry="16" fill="#0a1a10" opacity="0.15"/>
