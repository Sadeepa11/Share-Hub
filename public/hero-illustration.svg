    <rect x="20" y="10" width="10" height="10" rx="3" fill="#faf7f2" opacity="0.5"/>
    <rect x="6" y="24" width="10" height="10" rx="3" fill="#faf7f2" opacity="0.5"/>
    <rect x="20" y="24" width="10" height="10" rx="3" fill="#f97316" opacity="0.5"/>
    <rect x="6" y="38" width="24" height="6" rx="2" fill="#faf7f2" opacity="0.3"/>
