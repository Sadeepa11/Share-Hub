    <!-- Ears -->
    <circle cx="8" cy="5" r="8" fill="#ea580c"/>
    <circle cx="36" cy="5" r="8" fill="#ea580c"/>
    <circle cx="8" cy="5" r="4" fill="#f97316" opacity="0.85"/>
    <circle cx="36" cy="5" r="4" fill="#f97316" opacity="0.85"/>
