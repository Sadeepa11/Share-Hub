    <circle cx="36" cy="12" r="10" fill="none" stroke="#faf7f2" stroke-width="2.5" opacity="0.7"/>
    <line x1="22" y1="12" x2="26" y2="12" stroke="#faf7f2" stroke-width="2.5" opacity="0.7"/>
    <line x1="2" y1="8" x2="-6" y2="5" stroke="#faf7f2" stroke-width="2.5" opacity="0.7" stroke-linecap="round"/>
    <line x1="46" y1="8" x2="54" y2="5" stroke="#faf7f2" stroke-width="2.5" opacity="0.7" stroke-linecap="round"/>
