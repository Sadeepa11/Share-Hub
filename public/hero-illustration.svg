<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" fill="none">
  <!-- Background blobs -->
  <circle cx="260" cy="220" r="190" fill="#2d4a35" opacity="0.18"/>
  <circle cx="260" cy="220" r="130" fill="#2d4a35" opacity="0.12"/>

