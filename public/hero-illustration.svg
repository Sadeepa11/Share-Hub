  <rect x="200" y="232" width="120" height="94" rx="10" fill="#f97316"/>
  <!-- Box shading -->
  <rect x="200" y="232" width="120" height="30" rx="10" fill="#ea580c"/>
  <rect x="200" y="252" width="120" height="10" fill="#ea580c"/>
  <!-- Ribbon vertical -->
  <rect x="250" y="232" width="18" height="94" fill="#c2410c" opacity="0.5" rx="2"/>
  <!-- Ribbon horizontal -->
  <rect x="200" y="262" width="120" height="16" fill="#c2410c" opacity="0.5"/>
